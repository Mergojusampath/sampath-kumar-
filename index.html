<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Mergoju Sampathkumar | DCS Automation Engineer</title>

<meta name="description"
content="Portfolio of Mergoju Sampathkumar - DCS, PCS 7, PLC, SCADA and Industrial Automation Engineer.">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

/* =========================================================
   GLOBAL
========================================================= */

:root{
    --bg:#06111c;
    --bg2:#0a1d2c;
    --card:#0c2233;
    --line:#1d4057;
    --text:#effaff;
    --muted:#a4b8c7;
    --cyan:#20d9ff;
    --green:#42e8b1;
    --max:1150px;
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Segoe UI,Arial,sans-serif;
    background:var(--bg);
    color:var(--text);
    line-height:1.6;
}

a{
    text-decoration:none;
    color:inherit;
}

.container{
    width:min(var(--max),92%);
    margin:auto;
}


/* =========================================================
   HEADER
========================================================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;
    z-index:50;

    background:rgba(6,17,28,.92);
    backdrop-filter:blur(14px);

    border-bottom:1px solid #173348;
}

.nav{
    height:70px;

    display:flex;
    align-items:center;
    justify-content:space-between;
}

.logo{
    font-weight:800;
    font-size:22px;
    letter-spacing:.7px;
}

.logo span{
    color:var(--cyan);
}

nav{
    display:flex;
    gap:25px;
}

nav a{
    font-size:14px;
    color:var(--muted);
    transition:.2s;
}

nav a:hover{
    color:var(--cyan);
}

.menu{
    display:none;

    background:none;
    border:0;

    color:#fff;
    font-size:28px;

    cursor:pointer;
}


/* =========================================================
   HERO
========================================================= */

.hero{
    position:relative;

    min-height:100vh;

    padding:105px 0 55px;

    overflow:hidden;

    background:
        radial-gradient(
            circle at 78% 62%,
            rgba(0,202,255,.14),
            transparent 28%
        ),
        linear-gradient(
            120deg,
            #03101a 0%,
            #061a29 55%,
            #03111b 100%
        );
}

.hero-tech-lines{
    position:absolute;
    inset:0;

    opacity:.22;

    background:
        repeating-linear-gradient(
            165deg,
            transparent 0 80px,
            rgba(32,217,255,.10) 81px 82px,
            transparent 83px 140px
        );

    pointer-events:none;
}

.hero-grid{
    display:grid;

    grid-template-columns:1.08fr .92fr;

    gap:28px;

    align-items:center;

    position:relative;
    z-index:1;
}

.hero-content{
    position:relative;
    z-index:5;
}

.brand-line{
    color:#c4d5df;

    font-size:12px;

    letter-spacing:2.2px;

    margin-bottom:36px;

    text-transform:uppercase;
}

.industrial-label{
    display:flex;
    align-items:center;

    gap:20px;

    color:var(--cyan);

    font-size:13px;

    letter-spacing:4px;

    font-weight:800;

    margin-bottom:18px;
}

.industrial-label span{
    display:block;

    width:75px;
    height:2px;

    background:var(--cyan);

    box-shadow:
        0 0 10px rgba(32,217,255,.6);
}

.hero h1{
    font-size:clamp(50px,7vw,88px);

    line-height:.94;

    letter-spacing:-3px;

    margin:0 0 15px;

    font-weight:800;
}

.hero h1 strong{
    color:var(--cyan);

    font-weight:800;
}

.hero-stack{
    font-size:clamp(20px,2.5vw,32px);

    font-weight:800;

    color:var(--cyan);

    letter-spacing:1px;

    margin-bottom:24px;
}

.hero-stack b{
    color:#87b6c8;

    font-weight:400;

    padding:0 5px;
}

.hero-intro{
    max-width:690px;

    color:#d2e0e7;

    font-size:18px;

    line-height:1.65;
}


/* =========================================================
   BUTTONS
========================================================= */

.actions{
    display:flex;

    gap:12px;

    flex-wrap:wrap;

    margin-top:28px;
}

.btn{
    padding:12px 18px;

    border-radius:9px;

    border:1px solid var(--line);

    font-weight:700;

    font-size:14px;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}

.primary{
    background:var(--cyan);

    color:#04131c;

    border-color:var(--cyan);

    box-shadow:
        0 0 24px rgba(32,217,255,.14);
}

.secondary{
    background:#0b2131;

    color:#effaff;
}

.icon-btn{
    display:inline-flex;

    align-items:center;

    gap:8px;
}

.icon-btn i{
    font-size:15px;
}

.arrow-icon{
    margin-left:8px;
    font-size:12px!important;
}


/* =========================================================
   SOCIAL
========================================================= */

.hero-social{
    margin-top:28px;
}

.social-row{
    display:flex;

    gap:10px;

    margin-top:15px;

    flex-wrap:wrap;
}

.social-icon{
    display:inline-flex;

    align-items:center;
    justify-content:center;

    width:54px;
    height:54px;

    border:1px solid #075d78;

    border-radius:14px;

    background:rgba(4,24,37,.72);

    color:var(--cyan);

    font-size:22px;

    transition:.2s;
}

.social-icon:hover{
    transform:translateY(-2px);

    border-color:var(--cyan);

    box-shadow:
        0 0 18px rgba(32,217,255,.15);
}


/* =========================================================
   CAPABILITY CARDS
========================================================= */

.capability-grid{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:12px;

    max-width:560px;

    margin-top:38px;
}

.capability{
    display:flex;

    align-items:center;

    gap:14px;

    padding:16px 18px;

    border:1px solid #07516b;

    border-radius:15px;

    background:rgba(5,28,43,.62);

    backdrop-filter:blur(8px);
}

.capability i{
    font-size:25px;

    color:var(--cyan);

    width:30px;

    text-align:center;
}

.capability b{
    display:block;

    font-size:16px;
}

.capability small{
    display:block;

    color:var(--muted);

    font-size:11px;

    margin-top:1px;
}


/* =========================================================
   RIGHT INDUSTRIAL VISUAL
========================================================= */

.hero-visual{
    height:650px;

    position:relative;

    overflow:hidden;

    min-width:0;
}

.hero-visual:after{
    content:"";

    position:absolute;

    inset:0;

    background:
        linear-gradient(
            90deg,
            var(--bg) 0%,
            transparent 22%
        ),
        linear-gradient(
            0deg,
            var(--bg) 0%,
            transparent 25%
        );

    pointer-events:none;

    z-index:1;
}


/* =========================================================
   YOUR PROFILE PHOTO
========================================================= */

.hero-photo-card{
    position:absolute;

    top:18px;
    right:18px;

    z-index:15;

    width:170px;

    padding:9px;

    border:1px solid #0b6078;

    border-radius:17px;

    background:rgba(4,20,31,.90);

    box-shadow:
        0 18px 45px rgba(0,0,0,.45),
        0 0 25px rgba(32,217,255,.10);

    backdrop-filter:blur(10px);
}

.hero-photo-frame{
    width:100%;

    height:190px;

    border-radius:12px;

    overflow:hidden;

    background:#081923;

    border:1px solid #1c465e;

    display:flex;

    align-items:center;

    justify-content:center;
}

.hero-photo-frame img{
    width:100%;

    height:100%;

    display:block;

    object-fit:contain;

    object-position:center;

    background:#081923;
}

.hero-photo-caption{
    padding:8px 2px 2px;

    text-align:center;
}

.hero-photo-caption strong{
    display:block;

    color:#e7faff;

    font-size:9px;

    letter-spacing:1px;

    white-space:nowrap;
}

.hero-photo-caption span{
    display:block;

    margin-top:3px;

    color:var(--cyan);

    font-size:8px;

    letter-spacing:1.4px;
}


/* =========================================================
   INDUSTRIAL LABELS
========================================================= */

.visual-label{
    position:absolute;

    right:12px;

    color:#2b91ab;

    font-size:14px;

    letter-spacing:4px;

    z-index:4;

    border-bottom:1px solid #16657d;

    padding:0 0 8px;

    width:125px;
}

.label-one{
    top:95px;
}

.label-two{
    top:145px;
}

.label-three{
    top:195px;
}

.label-four{
    top:245px;
}


/* =========================================================
   PLANT
========================================================= */

.plant-glow{
    position:absolute;

    width:480px;
    height:480px;

    right:0;
    bottom:40px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(0,211,255,.22),
            rgba(0,80,110,.08) 42%,
            transparent 70%
        );

    filter:blur(4px);
}

.plant-towers{
    position:absolute;

    right:18px;
    bottom:75px;

    width:470px;
    height:410px;

    opacity:.88;

    filter:
        drop-shadow(
            0 0 15px rgba(32,217,255,.14)
        );

    z-index:2;
}

.tower{
    position:absolute;

    bottom:0;

    border:2px solid #2d9db9;

    border-bottom:0;

    background:
        linear-gradient(
            90deg,
            rgba(5,34,48,.8),
            rgba(24,83,103,.45),
            rgba(4,25,37,.9)
        );

    border-radius:60px 60px 0 0;
}

.tower:before{
    content:"";

    position:absolute;

    left:12px;
    right:12px;

    top:35%;

    height:2px;

    background:#20d9ff66;

    box-shadow:
        0 70px #20d9ff55,
        0 140px #20d9ff44;
}

.tower span{
    position:absolute;

    top:-30px;
    left:50%;

    width:5px;
    height:30px;

    background:#2d9db9;

    transform:translateX(-50%);
}

.tower span:before{
    content:"";

    position:absolute;

    width:12px;
    height:12px;

    border-radius:50%;

    background:#b8f7ff;

    box-shadow:
        0 0 18px #20d9ff;

    left:-3px;
    top:-7px;
}

.tower i{
    position:absolute;

    width:22px;
    height:22px;

    border:2px solid #2d9db9;

    border-radius:50%;

    left:-25px;

    top:45%;

    opacity:.7;
}

.tower i:nth-child(3){
    top:65%;

    right:-25px;

    left:auto;
}

.tower-a{
    height:245px;

    width:75px;

    left:220px;
}

.tower-b{
    height:330px;

    width:105px;

    left:320px;
}

.tower-c{
    height:185px;

    width:65px;

    left:125px;
}


/* =========================================================
   TANK
========================================================= */

.tank{
    position:absolute;

    left:35px;
    bottom:5px;

    width:115px;
    height:100px;

    border:2px solid #2d9db9;

    border-radius:12px 12px 25px 25px;

    background:
        linear-gradient(
            #16485b,
            #061c2a
        );
}

.tank:before{
    content:"";

    position:absolute;

    left:-18px;
    right:-18px;

    top:-12px;

    height:14px;

    border:2px solid #2d9db9;

    border-radius:50%;

    background:#0a2635;
}

.tank b{
    position:absolute;

    left:15px;
    right:15px;

    top:28px;

    height:3px;

    background:#20d9ff55;
}

.tank em{
    position:absolute;

    width:4px;
    height:70px;

    background:#2d9db9;

    right:-28px;
    top:20px;
}


/* =========================================================
   ENGINEER SILHOUETTE
========================================================= */

.engineer-silhouette{
    position:absolute;

    right:35px;
    bottom:0;

    width:210px;
    height:300px;

    z-index:5;

    filter:
        drop-shadow(
            0 0 18px rgba(0,0,0,.8)
        );
}

.helmet{
    position:absolute;

    top:0;
    left:60px;

    width:105px;
    height:70px;

    background:
        linear-gradient(
            145deg,
            #263d47,
            #07131b
        );

    border-radius:55px 55px 30px 30px;

    border:2px solid #55727c;
}

.helmet:after{
    content:"";

    position:absolute;

    left:-8px;
    right:-8px;

    bottom:8px;

    height:12px;

    background:#111e25;

    border:1px solid #607b84;

    border-radius:8px;
}

.body{
    position:absolute;

    left:15px;
    top:62px;

    width:185px;
    height:238px;

    background:
        linear-gradient(
            110deg,
            #1c343e,
            #06131b 65%
        );

    clip-path:
        polygon(
            28% 0,
            72% 0,
            100% 20%,
            100% 100%,
            0 100%,
            0 20%
        );

    border:1px solid #35545f;
}

.body:after{
    content:"";

    position:absolute;

    left:55px;
    top:20px;

    width:70px;
    height:180px;

    border-left:2px solid #64818a;

    border-right:2px solid #203943;

    opacity:.5;
}

.tablet{
    position:absolute;

    left:0;
    bottom:70px;

    width:95px;
    height:68px;

    background:#07141c;

    border:3px solid #40616b;

    border-radius:7px;

    transform:rotate(-8deg);

    z-index:4;

    box-shadow:
        0 0 20px rgba(32,217,255,.18);
}

.tablet span{
    display:block;

    height:3px;

    background:#20d9ff;

    margin:12px 10px 0;

    opacity:.7;
}

.tablet span+span{
    margin-top:8px;

    width:55%;
}


/* =========================================================
   VISUAL CHIP
========================================================= */

.visual-chip{
    position:absolute;

    right:35px;
    top:315px;

    z-index:7;

    border-left:3px solid var(--cyan);

    padding:12px 0 12px 18px;

    display:flex;

    gap:12px;

    align-items:center;

    background:rgba(3,20,30,.55);
}

.visual-chip i{
    color:var(--cyan);

    font-size:22px;
}

.visual-chip b,
.visual-chip small{
    display:block;

    letter-spacing:2px;
}

.visual-chip b{
    font-size:12px;

    color:#75d8ed;
}

.visual-chip small{
    font-size:10px;

    color:#478da1;

    margin-top:4px;
}


/* =========================================================
   HERO QUOTE
========================================================= */

.hero-quote{
    grid-column:1/-1;

    margin-top:-20px;

    padding:30px 38px;

    border:1px solid #0b6078;

    border-radius:24px;

    background:rgba(4,23,35,.72);

    position:relative;

    z-index:8;
}

.hero-quote i{
    font-size:36px;

    color:var(--cyan);

    float:left;

    margin-right:25px;
}

.hero-quote p{
    font-size:22px;

    font-style:italic;

    color:#d7e4e9;
}

.hero-quote span{
    display:block;

    text-align:right;

    color:var(--cyan);

    font-size:11px;

    letter-spacing:3px;

    margin-top:12px;
}


/* =========================================================
   COMMON SECTIONS
========================================================= */

section{
    padding:92px 0;
}

.kicker{
    color:var(--cyan);

    font-size:11px;

    text-transform:uppercase;

    letter-spacing:2px;

    font-weight:800;
}

h2{
    font-size:36px;

    line-height:1.15;

    margin:6px 0 10px;
}

.lead{
    color:var(--muted);

    max-width:760px;
}

.section-title{
    margin-bottom:35px;
}

.grid2{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;
}


/* =========================================================
   CARDS
========================================================= */

.card{
    background:
        linear-gradient(
            145deg,
            #0b2030,
            #081823
        );

    border:1px solid var(--line);

    border-radius:16px;

    padding:23px;
}

.card h3{
    margin-bottom:9px;
}

.card p,
.card li{
    font-size:14px;

    color:var(--muted);
}

.card ul{
    padding-left:19px;
}

.tag{
    color:var(--green);

    font-size:11px;

    font-weight:800;

    text-transform:uppercase;

    letter-spacing:1px;
}


/* =========================================================
   EXPERIENCE
========================================================= */

.timeline{
    display:grid;

    gap:14px;
}

.job{
    border-left:3px solid var(--cyan);

    padding:18px 20px;

    background:#091b2a;

    border-radius:0 13px 13px 0;

    border-top:1px solid var(--line);

    border-right:1px solid var(--line);

    border-bottom:1px solid var(--line);
}

.job .date{
    color:var(--cyan);

    font-size:12px;

    font-weight:700;
}

.job h3{
    margin:3px 0;
}

.job p{
    color:var(--muted);

    font-size:13px;
}


/* =========================================================
   SKILLS
========================================================= */

.skills{
    display:grid;

    grid-template-columns:
        repeat(3,1fr);

    gap:14px;
}

.skill{
    padding:17px;

    border:1px solid var(--line);

    border-radius:13px;

    background:#091b2a;
}

.skill b{
    display:block;

    margin-bottom:5px;
}

.skill span{
    color:var(--muted);

    font-size:12px;
}


/* =========================================================
   PROJECTS
========================================================= */

.projects{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:17px;
}

.project h3{
    margin:7px 0;
}

.project h4.project-heading{
    margin-top:22px;

    margin-bottom:9px;

    color:var(--text);

    font-size:16px;
}

.project-list{
    padding-left:20px;

    margin-top:4px;
}

.project-list li{
    margin-bottom:8px;

    color:var(--muted);

    font-size:14px;

    line-height:1.6;
}

.tools{
    display:flex;

    gap:6px;

    flex-wrap:wrap;

    margin-top:20px;
}

.tools span{
    font-size:10px;

    padding:5px 8px;

    border-radius:20px;

    background:#102c3f;

    border:1px solid #1a4a63;

    color:#c5f2ff;
}


/* =========================================================
   EDUCATION
========================================================= */

.edu{
    width:100%;

    border-collapse:collapse;
}

.edu th,
.edu td{
    border:1px solid #24475b;

    padding:10px;

    text-align:left;

    font-size:12px;
}

.edu th{
    background:#0e2b40;

    color:#bdeeff;
}

.edu td{
    color:var(--muted);
}


/* =========================================================
   VIDEO
========================================================= */

.video{
    border:1px solid var(--line);

    border-radius:16px;

    overflow:hidden;

    background:#081824;
}

.video video{
    display:block;

    width:100%;

    max-height:500px;

    background:#000;
}

.video-note{
    padding:12px;

    color:var(--muted);

    font-size:12px;
}

.video-title{
    display:flex;

    align-items:center;

    gap:10px;
}

.video-title i{
    color:var(--cyan);
}


/* =========================================================
   CONTACT
========================================================= */

.contact{
    display:grid;

    grid-template-columns:1fr 1fr;

    gap:20px;
}

.contact-item{
    padding:15px 0;

    border-bottom:1px solid var(--line);
}

.contact-item small{
    display:block;

    color:var(--muted);

    font-size:10px;

    text-transform:uppercase;

    letter-spacing:1px;
}

.contact-item a{
    color:var(--cyan);

    font-weight:700;
}

.contact-icon{
    width:24px;

    color:var(--cyan);

    display:inline-block;
}


/* =========================================================
   FOOTER
========================================================= */

footer{
    padding:28px 0;

    border-top:1px solid var(--line);

    color:var(--muted);

    font-size:12px;
}

.footer{
    display:flex;

    justify-content:space-between;
}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:800px){

    nav{
        display:none;

        position:absolute;

        top:70px;

        left:0;
        right:0;

        background:#071724;

        padding:18px 4%;

        flex-direction:column;

        bor
